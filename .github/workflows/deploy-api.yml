name: Spend Buddy API CI/CD

on:
    pull_request:
        branches:
            - main
        paths:
            - "apps/api/**"
            - "package.json"
            - "package-lock.json"
            - ".github/workflows/deploy-api.yml"

    push:
        branches:
            - main
        paths:
            - "apps/api/**"
            - "package.json"
            - "package-lock.json"
            - ".github/workflows/deploy-api.yml"

concurrency:
    group: spend-buddy-api-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    validate:
        name: Validate API
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Lint API
              run: npm --prefix apps/api run lint

            - name: Typecheck API
              run: npm --prefix apps/api run typecheck

            - name: Test API
              run: npm --prefix apps/api run test

            - name: Build API
              run: npm --prefix apps/api run build

    deploy:
        name: Deploy API to VPS
        runs-on: ubuntu-latest

        needs:
            - validate

        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set image name
              shell: bash
              run: |
                  OWNER="${GITHUB_REPOSITORY_OWNER,,}"
                  echo "IMAGE_NAME=ghcr.io/${OWNER}/spend-buddy-api" >> "$GITHUB_ENV"

            - name: Login to GHCR
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Setup Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Build and push Docker image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: ./apps/api/Dockerfile
                  push: true
                  tags: |
                      ${{ env.IMAGE_NAME }}:latest
                      ${{ env.IMAGE_NAME }}:${{ github.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Configure SSH
              shell: bash
              run: |
                  mkdir -p ~/.ssh

                  echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/spend_buddy
                  chmod 600 ~/.ssh/spend_buddy

                  ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

            - name: Deploy to VPS
              shell: bash
              run: |
                  ssh \
                    -i ~/.ssh/spend_buddy \
                    "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" << 'EOF'

                    set -e

                    cd ~/spend-buddy/api

                    echo "Pulling latest API image..."
                    docker compose pull api

                    echo "Starting updated API..."
                    docker compose up -d --no-deps api

                    echo "Removing unused images..."
                    docker image prune -f

                    echo "Deployment status:"
                    docker compose ps

                  EOF
